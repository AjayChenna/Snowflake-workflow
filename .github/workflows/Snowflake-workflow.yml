
name: Snowflake Multi-Environment Deployment

on:
  push:
    branches:
      - develop
      - release/*
      - main

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v3
      - name: Install SnowSQL
        run: |
          sudo apt-get update && sudo apt-get install -y snowsql
      - name: Deploy to DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER: ${{ secrets.SNOW_USER_DEV }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD_DEV }}
          SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE_DEV }}
        run: |
          for file in sql/*.sql; do
            snowsql -a $SNOWFLAKE_ACCOUNT -u $SNOWFLAKE_USER -p $SNOWFLAKE_PASSWORD \
            -r $SNOWFLAKE_ROLE -w $SNOWFLAKE_WAREHOUSE -d $SNOWFLAKE_DATABASE \
            -q "$(cat $file)"
          done

  deploy-qa:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: QA   # Requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v3
      - name: Install SnowSQL
        run: |
          sudo apt-get update && sudo apt-get install -y snowsql
      - name: Deploy to QA
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_QA }}
          SNOWFLAKE_USER: ${{ secrets.SNOW_USER_QA }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD_QA }}
          SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE_QA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE_QA }}
          SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE_QA }}
        run: |
          for file in sql/*.sql; do
